<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidStream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="TrenStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="TrenScript.js" defer></script>
</head>

<body>

    <header class="navbar">
        <div class="nav-left">
            <img src="../Asset/Logo/VoidstreamLogo.png" alt="VoidStream" class="logo">
            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="#">Movies</a>
                <a href="#">Trending</a>
            </nav>
        </div>

        <div class="nav-right">
            <div class="search-box">
                <input type="text" placeholder="Search">
                <i class="search-icon">🔍</i>
            </div>
            <a href="#" class="login-btn">Login</a>
        </div>
    </header>

    <article>
        <div class="container-fluid">
            <h2 class="text-center">Trending of The Year "2025"</h2>
            <div class ="accent-divider"></div>
            <div class = "subjudul text-center">
                Here are trending movies based on our user favorites and wactchlist in 2025.
            </div>
        </div>
    </article>

    <div class="category-bar">
        <span class="active">Action</span>
        <span>Adventure</span>
        <span>Anime</span>
        <span>Comedy</span>
        <span>Drama</span>
        <span>Fantasy</span>
        <span>Horror</span>
        <span>K-Drama</span>
        <span>Mystery</span>
        <span>Romance</span>
        <span>Slice of Life</span>
        <span>Sci-Fi</span>
        <span>Sport</span>
        <span>Thriller</span>
    </div>

    <section class="hero" id="heroSection">
        
        <iframe 
            id="heroVideo" 
            class="hero-bg-video" 
            src="" 
            frameborder="0" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>

        <div class="hero-content">
            
            <div class="hero-poster">
                <img id="heroPoster"alt="Movie Poster">
            </div>

            <div class="hero-info">
                <h1 id="heroTitle"></h1>

                <p class="hero-meta">
                    <span id="heroYear"></span>  
                    <br>
                    ⭐ <span id="heroRating"></span>
                </p>

                <p class="hero-desc" id="heroDesc"></p></p>

                <div class="hero-buttons">
                    <button id="btnTrailer" class="btn-outline">
                        <i class="fa fa-play"></i> Trailer
                    </button>
                    
                    <button id="btnPlay" class="btn-primary">
                        <i class="fa fa-play"></i> Play
                    </button>
                </div>
            </div>

        </div>
    </section>
