<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VoidStream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>


<body class="bg-dark d-flex justify-content-center align-items-center min-vh-100">
    <div class="card bg-black bg-opacity-75 text-white p-4 shadow-lg" style="width: 100%; max-width: 400px;">
    
    <h2 class="text-center mb-2">Login</h2>
    <p class="text-center text-secondary mb-4">Masuk ke akun VoidStream</p>
    <form id="loginForm">

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control bg-transparent text-white" placeholder="email@example.com" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control bg-transparent text-white" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Login
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="login.js"></script>
</body>
</html>
