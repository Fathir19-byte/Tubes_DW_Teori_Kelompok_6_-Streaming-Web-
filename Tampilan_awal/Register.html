<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | VoidStream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>

<body class="bg-dark d-flex justify-content-center align-items-center min-vh-100">
    <div class="card bg-black bg-opacity-75 text-white p-4 shadow-lg" style="width: 100%; max-width: 400px;">
    
    <h2 class="text-center mb-2">Register</h2>
    <p class="text-center text-secondary mb-4">Buat akun VoidStream baru</p>
    <form id="registerForm">

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control bg-transparent text-white" placeholder="email@example.com" required>
            <div id="emailError" class="invalid-feedback d-none"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control bg-transparent text-white" placeholder="••••••••" required>
            
            <div id="passwordCriteria" class="mt-2 d-none">
                <small class="d-block">Kriteria password:</small>
                <small id="length" class="d-block text-danger">❌ Minimal 8 karakter</small>
                <small id="uppercase" class="d-block text-danger">❌ Minimal 1 huruf kapital</small>
                <small id="lowercase" class="d-block text-danger">❌ Minimal 1 huruf kecil</small>
                <small id="number" class="d-block text-danger">❌ Minimal 1 angka</small>
                <small id="special" class="d-block text-danger">❌ Minimal 1 simbol (!@#$%^&*...)</small>
            </div>
            
            <div id="passwordError" class="invalid-feedback d-none"></div>
        </div>

        <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control bg-transparent text-white" placeholder="••••••••" required>
            <div id="confirmPasswordError" class="invalid-feedback d-none"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Daftar
        </button>
        
        <div class="mt-3 text-center">
            <small>Sudah punya akun? <a href="login.html" class="text-primary">Login di sini</a></small>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="register.js"></script>
</body>
</html>
